name: Controle documentatie

# Bouwt bij elke pull request de documentatie in strikte modus en biedt de gebouwde site aan
# als artifact. Deze workflow schrijft bewust niet naar gh-pages: publiceren gebeurt alleen
# bewust, met `task publish:github`.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: docs-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: Documentatie bouwen (strikt)
        run: mkdocs build --strict

      - name: Site aanbieden als artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-pr-${{ github.event.pull_request.number }}
          path: site/
          retention-days: 14
